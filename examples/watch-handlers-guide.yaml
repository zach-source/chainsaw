# Comprehensive Guide to Watch Handlers in Chainsaw
#
# Handlers are Chainsaw operations that execute at different points during the watch operation.
# They can be any operation supported in catch/finally blocks:
# - script: Run shell scripts
# - command: Execute commands
# - describe: Describe Kubernetes resources
# - get: Get Kubernetes resources
# - events: Get Kubernetes events
# - podLogs: Get pod logs
# - wait: Wait for resources
# - sleep: Sleep for a duration
# - delete: Delete resources
#
# Available environment variables in handlers:
# - $eventType: The type of Kubernetes watch event (ADDED, MODIFIED, DELETED)
# - $resource: The complete resource as JSON
# - $resourceYAML: The complete resource as YAML
# - $resourceName: The resource name
# - $resourceNamespace: The resource namespace
# - $resourceKind: The resource kind
# - $resourceAPIVersion: The resource API version
# - $NAMESPACE: The test namespace (from chainsaw)
#
# Handler Types:
# 1. onProgress: Executes on EVERY watch event
# 2. onSuccess: Executes when ALL success conditions are met
# 3. onFailure: Executes when ANY failure condition is met

apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Test
metadata:
  name: watch-handlers-comprehensive-guide
spec:
  namespace: chainsaw-demo
  steps:
    # Example 1: Using script handlers
    - name: create-config map
      apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: example-config
            namespace: chainsaw-demo
          data:
            status: "pending"

    - name: watch-with-script-handlers
      watch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: chainsaw-demo
          name: example-config
        timeout: 30s
        successConditions:
          - path: data.status
            op: "=="
            value: "ready"
        handlers:
          onProgress:
            - script:
                content: |
                  echo "Current status: $(echo '$resource' | jq -r '.data.status')"
          onSuccess:
            - script:
                content: |
                  echo "✅ ConfigMap is ready!"
                  echo "$resourceYAML"

    # Example 2: Using describe and get handlers
    - name: create-deployment
      apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-deployment
            namespace: chainsaw-demo
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:1.21

    - name: watch-with-describe-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 1
        handlers:
          onSuccess:
            - describe:
                apiVersion: apps/v1
                kind: Deployment
                namespace: chainsaw-demo
                name: nginx-deployment
            - get:
                apiVersion: v1
                kind: Pod
                namespace: chainsaw-demo
                selector: app=nginx
                format: wide

    # Example 3: Using events and podLogs handlers
    - name: watch-with-diagnostic-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.readyReplicas
            op: ">="
            value: 1
        handlers:
          onFailure:
            - script:
                content: echo "Deployment failed - collecting diagnostics"
            - describe:
                apiVersion: apps/v1
                kind: Deployment
                namespace: chainsaw-demo
                name: nginx-deployment
            - events:
                namespace: chainsaw-demo
            - podLogs:
                namespace: chainsaw-demo
                selector: app=nginx
                tail: 100

    # Example 4: Using command handlers
    - name: watch-with-command-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 1
        handlers:
          onProgress:
            - command:
                entrypoint: kubectl
                args:
                  - get
                  - pods
                  - -n
                  - chainsaw-demo
                  - -l
                  - app=nginx
          onSuccess:
            - command:
                entrypoint: kubectl
                args:
                  - rollout
                  - status
                  - deployment/nginx-deployment
                  - -n
                  - chainsaw-demo

    # Example 5: Multiple handlers of different types
    - name: watch-with-multiple-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 1
        handlers:
          onProgress:
            # Multiple handlers execute in order
            - script:
                content: echo "Event type: $eventType"
            - script:
                content: |
                  AVAILABLE=$(echo '$resource' | jq -r '.status.availableReplicas // 0')
                  echo "Available replicas: $AVAILABLE"
          onSuccess:
            # Can mix different operation types
            - script:
                content: echo "✅ Success!"
            - describe:
                apiVersion: apps/v1
                kind: Deployment
                namespace: chainsaw-demo
                name: nginx-deployment
            - get:
                apiVersion: v1
                kind: Pod
                namespace: chainsaw-demo
                selector: app=nginx
          onFailure:
            # Comprehensive diagnostics on failure
            - script:
                content: echo "❌ Deployment failed"
            - describe:
                apiVersion: apps/v1
                kind: Deployment
                namespace: chainsaw-demo
                name: nginx-deployment
            - events:
                namespace: chainsaw-demo
            - podLogs:
                namespace: chainsaw-demo
                selector: app=nginx
                tail: 100
            - script:
                content: |
                  echo "Saving failure state..."
                  echo "$resourceYAML" > /tmp/failed-deployment.yaml

    # Example 6: Using wait handler (wait for another resource)
    - name: watch-with-wait-handler
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 1
        handlers:
          onSuccess:
            - script:
                content: echo "Deployment ready, waiting for service..."
            - wait:
                apiVersion: v1
                kind: Service
                namespace: chainsaw-demo
                name: nginx-service
                for:
                  condition:
                    name: Ready

    # Example 7: Using delete handler (cleanup on failure)
    - name: watch-with-cleanup-on-failure
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 1
        handlers:
          onFailure:
            - script:
                content: echo "Deployment failed, cleaning up..."
            - delete:
                ref:
                  apiVersion: apps/v1
                  kind: Deployment
                  namespace: chainsaw-demo
                  name: nginx-deployment

    # Example 8: Conditional logic in script handlers
    - name: watch-with-conditional-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 120s
        handlers:
          onProgress:
            - script:
                content: |
                  AVAILABLE=$(echo '$resource' | jq -r '.status.availableReplicas // 0')
                  READY=$(echo '$resource' | jq -r '.status.readyReplicas // 0')

                  echo "Deployment progress: $AVAILABLE available, $READY ready"

                  if [ "$AVAILABLE" -eq 0 ]; then
                    echo "⏳ Waiting for pods to start..."
                  elif [ "$READY" -lt "$AVAILABLE" ]; then
                    echo "🔄 Pods starting, waiting for ready state..."
                  else
                    echo "✅ All replicas are ready!"
                  fi

    # Cleanup
    - name: cleanup
      delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: example-config
    - name: cleanup-deployment
      delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: nginx-deployment

---
# Example: Advanced handler usage with bindings
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Test
metadata:
  name: watch-handlers-with-bindings
spec:
  namespace: chainsaw-demo
  steps:
    - name: create-deployment
      apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: my-app
            namespace: chainsaw-demo
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: my-app
            template:
              metadata:
                labels:
                  app: my-app
              spec:
                containers:
                  - name: nginx
                    image: nginx:latest

    - name: watch-with-bindings
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: my-app
        timeout: 180s
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 3
        handlers:
          onProgress:
            # Handlers can access all test bindings plus watch-specific ones
            - script:
                content: |
                  echo "=== Deployment Status ==="
                  echo "Name: $resourceName"
                  echo "Namespace: $resourceNamespace"
                  echo "Event: $eventType"
                  echo ""
                  echo "Resource state:"
                  echo '$resource' | jq '{
                    replicas: .spec.replicas,
                    available: .status.availableReplicas,
                    ready: .status.readyReplicas,
                    updated: .status.updatedReplicas,
                    conditions: [.status.conditions[] | {type: .type, status: .status}]
                  }'
          onSuccess:
            - script:
                content: |
                  echo "🎉 Deployment rollout completed successfully!"
                  echo "Final resource version: $(echo '$resource' | jq -r '.metadata.resourceVersion')"
            - get:
                apiVersion: v1
                kind: Pod
                namespace: chainsaw-demo
                selector: app=my-app
                format: wide
          onFailure:
            - script:
                content: |
                  echo "❌ Deployment rollout failed"
                  echo "Last known state:"
                  echo "$resourceYAML"
            - describe:
                apiVersion: apps/v1
                kind: Deployment
                namespace: chainsaw-demo
                name: my-app
            - get:
                apiVersion: v1
                kind: Pod
                namespace: chainsaw-demo
                selector: app=my-app
            - podLogs:
                namespace: chainsaw-demo
                selector: app=my-app
                tail: 50
            - events:
                namespace: chainsaw-demo

    - name: cleanup
      delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: my-app
