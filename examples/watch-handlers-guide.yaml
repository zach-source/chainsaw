# Guide to Watch Handlers in Chainsaw
#
# Handlers are shell scripts that execute at different points during the watch operation.
# They have access to special environment variables containing information about the watched resource.
#
# Available environment variables in handlers:
# - $eventType: The type of Kubernetes watch event (ADDED, MODIFIED, DELETED)
# - $resource: The complete resource as JSON
# - $resourceYAML: The complete resource as YAML
# - $resourceName: The resource name
# - $resourceNamespace: The resource namespace
# - $resourceKind: The resource kind
# - $resourceAPIVersion: The resource API version
# - $NAMESPACE: The test namespace (from chainsaw)
#
# Handler Types:
# 1. onProgress: Executes on EVERY watch event (useful for logging/debugging)
# 2. onSuccess: Executes when ALL success conditions are met
# 3. onFailure: Executes when ANY failure condition is met

apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Test
metadata:
  name: watch-handlers-guide
spec:
  namespace: chainsaw-demo
  steps:
    - name: create-configmap
      apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: example-config
            namespace: chainsaw-demo
          data:
            status: "initializing"

    - name: watch-with-simple-handlers
      watch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: chainsaw-demo
          name: example-config
        timeout: 30s

        successConditions:
          - path: data.status
            op: "=="
            value: "ready"

        handlers:
          # Simple logging handler
          onProgress:
            - echo "Watching ConfigMap: status=$(echo '$resource' | jq -r '.data.status')"

          # Success handler with detailed output
          onSuccess:
            - |
              echo "ConfigMap is ready!"
              echo "Name: $resourceName"
              echo "Namespace: $resourceNamespace"
              echo "Event type: $eventType"

          # Failure handler with diagnostics
          onFailure:
            - |
              echo "ConfigMap did not reach ready state"
              echo "Current resource state:"
              echo "$resourceYAML"

    - name: watch-with-kubectl-handlers
      watch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: chainsaw-demo
          name: example-config
        timeout: 30s

        successConditions:
          - path: data.status
            op: "=="
            value: "complete"

        handlers:
          # Using kubectl in handlers
          onProgress:
            - kubectl get configmap example-config -n chainsaw-demo -o jsonpath='{.data.status}'

          onSuccess:
            - kubectl get configmap example-config -n chainsaw-demo -o yaml

          onFailure:
            - kubectl describe configmap example-config -n chainsaw-demo

    - name: watch-with-conditional-handlers
      watch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: chainsaw-demo
          name: example-config
        timeout: 30s

        successConditions:
          - path: data.status
            op: "=="
            value: "finished"

        handlers:
          # Handlers can include conditional logic
          onProgress:
            - |
              STATUS=$(echo '$resource' | jq -r '.data.status')
              echo "Current status: $STATUS"

              case $STATUS in
                initializing)
                  echo "⏳ Initialization in progress..."
                  ;;
                ready)
                  echo "✅ Ready - waiting for completion..."
                  ;;
                complete)
                  echo "🎉 Complete - finalizing..."
                  ;;
                finished)
                  echo "🏁 Finished!"
                  ;;
                *)
                  echo "⚠️  Unknown status: $STATUS"
                  ;;
              esac

          # Handler can save data to files
          onSuccess:
            - |
              echo "Saving final state to /tmp/final-state.yaml"
              echo "$resourceYAML" > /tmp/final-state.yaml
              echo "Saved successfully"

    - name: watch-with-jq-handlers
      watch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          namespace: chainsaw-demo
          name: example-config
        timeout: 30s

        handlers:
          # Advanced jq usage in handlers
          onProgress:
            - |
              echo "All ConfigMap data:"
              echo '$resource' | jq '.data'

              echo "Specific field:"
              echo '$resource' | jq -r '.data.status // "not set"'

              echo "Resource metadata:"
              echo '$resource' | jq '{name: .metadata.name, namespace: .metadata.namespace, labels: .metadata.labels}'

    - name: cleanup
      delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: example-config


---
# Example: Watching a Deployment with comprehensive handlers
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Test
metadata:
  name: deployment-watch-with-diagnostics
spec:
  namespace: chainsaw-demo
  steps:
    - name: create-deployment
      apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-deployment
            namespace: chainsaw-demo
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:1.21
                    ports:
                      - containerPort: 80

    - name: watch-deployment-rollout
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: nginx-deployment
        timeout: 180s

        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 3
          - path: status.readyReplicas
            op: ">="
            value: 3

        failureConditions:
          - path: status.conditions[?(@.type=="Progressing")].status
            op: "=="
            value: "False"
          - path: status.conditions[?(@.type=="Available")].status
            op: "=="
            value: "False"

        handlers:
          onProgress:
            - |
              AVAILABLE=$(echo '$resource' | jq -r '.status.availableReplicas // 0')
              READY=$(echo '$resource' | jq -r '.status.readyReplicas // 0')
              REPLICAS=$(echo '$resource' | jq -r '.spec.replicas')

              echo "Deployment progress: $AVAILABLE/$REPLICAS available, $READY/$REPLICAS ready"

              # Show pod status
              echo "Pod status:"
              kubectl get pods -n $resourceNamespace -l app=nginx -o wide

          onSuccess:
            - |
              echo "✅ Deployment rollout successful!"
              echo ""
              echo "Deployment details:"
              kubectl get deployment nginx-deployment -n chainsaw-demo
              echo ""
              echo "Pod details:"
              kubectl get pods -n chainsaw-demo -l app=nginx -o wide
              echo ""
              echo "Resource version: $(echo '$resource' | jq -r '.metadata.resourceVersion')"

          onFailure:
            - |
              echo "❌ Deployment rollout failed!"
              echo ""
              echo "Deployment status:"
              kubectl describe deployment nginx-deployment -n chainsaw-demo
              echo ""
              echo "Pod status:"
              kubectl get pods -n chainsaw-demo -l app=nginx
              echo ""
              echo "Recent events:"
              kubectl get events -n chainsaw-demo --sort-by='.lastTimestamp' | grep nginx-deployment | tail -20
              echo ""
              echo "Pod logs (if any pods exist):"
              kubectl logs -n chainsaw-demo -l app=nginx --tail=50 --all-containers=true || echo "No pods found"

    - name: cleanup
      delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: nginx-deployment
