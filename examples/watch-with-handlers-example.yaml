apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Test
metadata:
  name: watch-with-handlers-example
spec:
  namespace: chainsaw-demo
  steps:
    # Step 1: Create a deployment
    - name: create-deployment
      apply:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: example-deployment
            namespace: chainsaw-demo
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: example
            template:
              metadata:
                labels:
                  app: example
              spec:
                containers:
                  - name: nginx
                    image: nginx:latest

    # Step 2: Watch the deployment with handlers
    - name: watch-deployment-with-handlers
      watch:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          namespace: chainsaw-demo
          name: example-deployment
        timeout: 120s

        # Success condition: both replicas are available
        successConditions:
          - path: status.availableReplicas
            op: ">="
            value: 2

        # Failure conditions
        failureConditions:
          - path: status.conditions[?(@.type=="Progressing")].status
            op: "=="
            value: "False"

        # Event handlers with examples
        handlers:
          # Called on every watch event (useful for debugging)
          onProgress:
            - echo "Watch event received - Type: $eventType"
            - echo "Resource: $resourceName in $resourceNamespace"
            - echo "Available replicas: $(echo '$resource' | jq -r '.status.availableReplicas // 0')"

          # Called when all success conditions are met
          onSuccess:
            - echo "✅ Deployment is ready!"
            - echo "Final state:"
            - echo "$resourceYAML"
            - kubectl get deployment example-deployment -n chainsaw-demo -o wide

          # Called when any failure condition is met
          onFailure:
            - echo "❌ Deployment failed!"
            - kubectl describe deployment example-deployment -n chainsaw-demo
            - kubectl get pods -n chainsaw-demo -l app=example
            - kubectl logs -n chainsaw-demo -l app=example --tail=50

    # Step 3: Cleanup
    - name: cleanup
      delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: example-deployment
